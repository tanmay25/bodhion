<svg style="background:#ffffff;" width="320" height="336" viewBox="0 0 105 105" xmlns="http://www.w3.org/2000/svg" role="img" >
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Bodhion logo</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A glowing central circle with six radiating arcs expanding outward like a neural pulse, with a soft cyan drop shadow.</desc>
<defs>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#a8f1ff"/>
<stop offset="55%" stop-color="#25d7ff"/>
<stop offset="100%" stop-color="#1aa8d4"/>
</radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#25d7ff" stop-opacity="0.55"/>
<stop offset="50%" stop-color="#25d7ff" stop-opacity="0.18"/>
<stop offset="100%" stop-color="#25d7ff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0068c9"/>
<stop offset="100%" stop-color="#25d7ff"/>
</linearGradient>
<linearGradient id="arc2" x1="100%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0068c9"/>
<stop offset="100%" stop-color="#25d7ff"/>
</linearGradient>
<linearGradient id="arc3" x1="50%" y1="0%" x2="50%" y2="100%">
<stop offset="0%" stop-color="#0068c9"/>
<stop offset="100%" stop-color="#25d7ff"/>
</linearGradient>
<filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
<feFlood flood-color="#25d7ff" flood-opacity="0.9"/>
<feComposite in2="blur" operator="in" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
<feFlood flood-color="#25d7ff" flood-opacity="1"/>
<feComposite in2="blur" operator="in" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
