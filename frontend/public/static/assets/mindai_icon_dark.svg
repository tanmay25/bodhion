<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MindAI dark-mode icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#02060D"/>
    </linearGradient>

    <linearGradient id="discGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B52B4"/>
      <stop offset="42%" stop-color="#1FA3FF"/>
      <stop offset="75%" stop-color="#19C56E"/>
      <stop offset="100%" stop-color="#C7E81E"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2AA8FF"/>
      <stop offset="55%" stop-color="#20C96A"/>
      <stop offset="100%" stop-color="#E0F12A"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFCE0" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FFE66D" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFE66D" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="discClip">
      <ellipse cx="256" cy="210" rx="126" ry="88" transform="rotate(-18 256 210)"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="256" cy="370" rx="120" ry="18" fill="#1FA3FF" opacity="0.18" filter="url(#softGlow)"/>

  <ellipse cx="250" cy="260" rx="122" ry="88" transform="rotate(-18 250 260)" fill="#071B43" opacity="0.98"/>
  <ellipse cx="254" cy="252" rx="122" ry="82" transform="rotate(-18 254 252)" fill="url(#ringGrad)" opacity="0.35"/>

  <ellipse cx="256" cy="210" rx="126" ry="88" transform="rotate(-18 256 210)" fill="url(#discGrad)"/>
  <ellipse cx="256" cy="210" rx="126" ry="88" transform="rotate(-18 256 210)" fill="none" stroke="#0A1E4D" stroke-width="8"/>

  <path d="M107 277 C145 326, 248 349, 356 320 C417 303, 461 262, 473 214"
        fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round"/>
  <path d="M117 269 C152 313, 249 335, 349 307 C405 292, 444 257, 454 219"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.98"/>

  <circle cx="449" cy="188" r="18" fill="url(#discGrad)" stroke="#0A1E4D" stroke-width="4"/>

  <g clip-path="url(#discClip)">
    <circle cx="256" cy="210" r="82" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.9"/>
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M256 210 L256 128"/><circle cx="256" cy="118" r="5" fill="#fff"/>
      <path d="M256 210 L300 140"/><circle cx="307" cy="129" r="5" fill="#fff"/>
      <path d="M256 210 L343 162"/><circle cx="355" cy="155" r="5" fill="#fff"/>
      <path d="M256 210 L355 208"/><circle cx="370" cy="208" r="5" fill="#fff"/>
      <path d="M256 210 L336 255"/><circle cx="349" cy="262" r="5" fill="#fff"/>
      <path d="M256 210 L300 281"/><circle cx="308" cy="292" r="5" fill="#fff"/>
      <path d="M256 210 L256 292"/><circle cx="256" cy="305" r="5" fill="#fff"/>
      <path d="M256 210 L212 281"/><circle cx="205" cy="292" r="5" fill="#fff"/>
      <path d="M256 210 L173 255"/><circle cx="160" cy="262" r="5" fill="#fff"/>
      <path d="M256 210 L159 208"/><circle cx="145" cy="208" r="5" fill="#fff"/>
      <path d="M256 210 L171 162"/><circle cx="158" cy="155" r="5" fill="#fff"/>
      <path d="M256 210 L212 140"/><circle cx="205" cy="129" r="5" fill="#fff"/>
    </g>
    <rect x="226" y="180" width="60" height="60" rx="4" fill="#FFF5BF" stroke="#F0C419" stroke-width="8" transform="rotate(-1 256 210)"/>
  </g>
</svg>
